<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 720" font-family="Inter, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8z" fill="#64748b"/></marker>
    <style>
      .box{fill:#0f172a;stroke:#334155;stroke-width:1.5;rx:10}
      .key{fill:#1e1b4b;stroke:#6366f1;stroke-width:2;rx:10}
      .ok{fill:#052e16;stroke:#22c55e;stroke-width:2;rx:10}
      .t{fill:#e2e8f0;font-size:14px;font-weight:600}
      .s{fill:#94a3b8;font-size:11.5px}
      .h{fill:#a5b4fc;font-size:12px;font-weight:700;letter-spacing:.08em}
      .ln{stroke:#64748b;stroke-width:1.6;fill:none;marker-end:url(#a)}
      .dash{stroke:#22c55e;stroke-width:1.6;fill:none;stroke-dasharray:6 4;marker-end:url(#a)}
    </style>
  </defs>
  <rect width="1240" height="720" fill="#020617"/>
  <text x="30" y="38" fill="#f8fafc" font-size="22" font-weight="700">SURAKSHA - Social &amp; App Monitoring: architecture</text>
  <text x="30" y="60" class="s">Official assets are excluded BEFORE any scoring. Unavailable sources degrade to labeled sample / manual input - never fabricated data.</text>

  <!-- column headers -->
  <text x="30" y="96" class="h">1 · DATA SOURCES</text>
  <text x="330" y="96" class="h">2 · CONNECTORS</text>
  <text x="600" y="96" class="h">3 · DETECTION ENGINE</text>
  <text x="940" y="96" class="h">4 · STORAGE &amp; REVIEW</text>

  <!-- sources -->
  <rect class="box" x="30" y="110" width="250" height="64"/><text class="t" x="46" y="136">X / Twitter API v2</text><text class="s" x="46" y="156">needs bearer token</text>
  <rect class="box" x="30" y="190" width="250" height="64"/><text class="t" x="46" y="216">Apple iTunes Search API</text><text class="s" x="46" y="236">public, rate-limited</text>
  <rect class="box" x="30" y="270" width="250" height="64"/><text class="t" x="46" y="296">Google Play / APK mirrors</text><text class="s" x="46" y="316">optional connector, fails gracefully</text>
  <rect class="box" x="30" y="350" width="250" height="64"/><text class="t" x="46" y="376">Labeled sample dataset</text><text class="s" x="46" y="396">offline demo, always marked is_sample</text>
  <rect class="box" x="30" y="430" width="250" height="64"/><text class="t" x="46" y="456">Manual submission</text><text class="s" x="46" y="476">paste profile / app + upload avatar or icon</text>

  <!-- connectors -->
  <rect class="box" x="330" y="110" width="230" height="384"/>
  <text class="t" x="346" y="138">Connector registry</text>
  <text class="s" x="346" y="162">status per source:</text>
  <text class="s" x="346" y="182">live · sample · unavailable</text>
  <text class="s" x="346" y="212">timeouts, rate-limit handling,</text>
  <text class="s" x="346" y="230">no secrets exposed</text>
  <line x1="346" y1="250" x2="544" y2="250" stroke="#334155"/>
  <text class="t" x="346" y="278">Normalizer</text>
  <text class="s" x="346" y="300">unified candidate schema:</text>
  <text class="s" x="346" y="318">name · handle · bio · avatar/icon</text>
  <text class="s" x="346" y="336">publisher · package id · description</text>
  <text class="s" x="346" y="354">store · account age · links</text>
  <text class="s" x="346" y="392">GET /integrations/status</text>
  <text class="s" x="346" y="410">shown in UI source-status panel</text>

  <!-- brand profile -->
  <rect class="ok" x="600" y="110" width="290" height="96"/>
  <text class="t" x="616" y="136">Brand Profile (ground truth)</text>
  <text class="s" x="616" y="158">name · official logo (validated upload)</text>
  <text class="s" x="616" y="176">official handles · apps / package ids</text>
  <text class="s" x="616" y="194">publishers · domains · partners · keywords</text>

  <!-- exclusion -->
  <rect class="key" x="600" y="232" width="290" height="70"/>
  <text class="t" x="616" y="258">A · Official-asset exclusion</text>
  <text class="s" x="616" y="278">exact handle / package id / verified publisher</text>
  <text class="s" x="616" y="294">family -> excluded, never persisted as a threat</text>

  <!-- signals -->
  <rect class="box" x="600" y="328" width="290" height="166"/>
  <text class="t" x="616" y="354">B · Explainable signals</text>
  <text class="s" x="616" y="376">look-alike names: swaps, spacing, added words,</text>
  <text class="s" x="616" y="392">homoglyphs, leetspeak (false-positive guarded)</text>
  <text class="s" x="616" y="414">logo / icon perceptual-hash similarity</text>
  <text class="s" x="616" y="430">publisher mismatch · package-id mimicry</text>
  <text class="s" x="616" y="446">description similarity · scam cues (OTP, KYC…)</text>
  <text class="s" x="616" y="462">partner / parody mitigation · new-account flag</text>
  <text class="s" x="616" y="482">missing data reported, never guessed</text>

  <!-- storage -->
  <rect class="box" x="940" y="110" width="270" height="140"/>
  <text class="t" x="956" y="136">SQL store (SQLAlchemy / Alembic)</text>
  <text class="s" x="956" y="158">brands · handles · apps · publishers</text>
  <text class="s" x="956" y="176">findings · signals · evidence trail</text>
  <text class="s" x="956" y="194">per-user workspace isolation</text>
  <text class="s" x="956" y="212">sample data flagged is_sample</text>
  <text class="s" x="956" y="230">logo files (type / size validated)</text>

  <rect class="box" x="940" y="276" width="270" height="218"/>
  <text class="t" x="956" y="302">Analyst UI (React)</text>
  <text class="s" x="956" y="326">Brand Profile wizard + logo upload</text>
  <text class="s" x="956" y="344">Check a social profile</text>
  <text class="s" x="956" y="362">Check a mobile app</text>
  <text class="s" x="956" y="380">Findings · Investigations · Threat graph</text>
  <text class="s" x="956" y="410">each detection shows WHY it fired:</text>
  <text class="s" x="956" y="428">signals, evidence, counter-evidence,</text>
  <text class="s" x="956" y="446">recommended action</text>
  <text class="s" x="956" y="474">analyst confirms - no auto-actions</text>

  <!-- arrows -->
  <path class="ln" d="M280 142 H330"/><path class="ln" d="M280 222 H330"/><path class="ln" d="M280 302 H330"/><path class="ln" d="M280 382 H330"/><path class="ln" d="M280 462 H330"/>
  <path class="ln" d="M560 300 H600 V267"/>
  <path class="dash" d="M745 206 V232"/>
  <path class="ln" d="M745 302 V328"/>
  <path class="dash" d="M890 158 H915 V400 H890" />
  <path class="ln" d="M890 411 H940"/>
  <path class="ln" d="M1075 250 V276"/>
  <text x="600" y="530" class="s">dashed green = the brand profile drives both exclusion and detection</text>

  <!-- bottom: flow summary -->
  <rect x="30" y="560" width="1180" height="130" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="50" y="590" class="h">REQUEST FLOW</text>
  <text x="50" y="616" class="t" font-size="13">Candidate -> normalize -> is it an official asset? yes: excluded (reason shown) · no: run signals -> weighted explainable score (LOW / MEDIUM / HIGH / CRITICAL)</text>
  <text x="50" y="642" class="s" font-size="12.5">-> optional ML supporting evidence (fake-account model; never sole proof) -> persisted finding with evidence trail -> analyst triage and takedown report</text>
  <text x="50" y="668" class="s" font-size="12.5">Honest limits: logo match is perceptual (edited / redrawn logos can drop below threshold) · live X and Google Play access depend on credentials and platform terms.</text>
</svg>
