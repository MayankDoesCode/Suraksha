name: Android APK

# Builds an installable Suraksha APK (Capacitor) and attaches it to the run.
#   Run manually:  Actions -> "Android APK" -> Run workflow -> download "suraksha-apk" from the run page.
#   Release:       push a tag like v1.0.0 and the APK is attached to a GitHub Release.

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Backend API base URL baked into the app"
        required: false
        default: "https://suraksha-platform.onrender.com/api/v1"
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: ${{ github.event.inputs.api_base_url || 'https://suraksha-platform.onrender.com/api/v1' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses and add platform 36
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0"

      - name: Build web app and sync into the Android project
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Assemble debug APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: cp frontend/android/app/build/outputs/apk/debug/app-debug.apk suraksha.apk

      - uses: actions/upload-artifact@v4
        with:
          name: suraksha-apk
          path: suraksha.apk
          if-no-files-found: error

      - name: Attach APK to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: suraksha.apk
