services:
  - type: web
    name: suraksha-platform
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      # Free Render Postgres expires ~30 days after creation, so point this at a free, non-expiring
      # Postgres (e.g. Neon free tier). Paste the connection string in the Render dashboard.
      - key: DATABASE_URL
        sync: false
      # Optional: free Hugging Face CPU Space that serves the URL model; falls back to rules when unreachable.
      - key: SURAKSHA_ML_REMOTE_URL
        sync: false
      - key: SURAKSHA_ML_REMOTE_TOKEN
        sync: false
      - key: ITUNES_STORE_COUNTRY
        value: US
      - key: ITUNES_API_TIMEOUT
        value: "10"
      - key: X_BEARER_TOKEN
        sync: false
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
      - key: VITE_FIREBASE_FIRESTORE_DATABASE_ID
        value: "(default)"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: LANGSMITH_TRACING
        value: "false"
      - key: LANGSMITH_API_KEY
        sync: false
      - key: LANGSMITH_PROJECT
        value: suraksha-investigations

